<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arushi Turns Twenty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Dancing+Script:wght@600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Page-specific styles */
    body { overflow: hidden; }

    #particles-js {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .lyrics-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .lyrics-line {
      position: absolute;
      white-space: nowrap;
      font-family: 'Dancing Script', cursive;
      font-size: 2rem;
      color: var(--accent-pink);
      opacity: 0.10;
      pointer-events: none;
      will-change: transform;
    }

    @keyframes drift-diagonal {
      from { transform: translate(-30vw, 110vh); }
      to   { transform: translate(130vw, -20vh); }
    }

    .main-content {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 1.5rem;
    }

    .for-label {
      font-family: 'Dancing Script', cursive;
      font-size: 1.4rem;
      color: var(--accent-gold);
      letter-spacing: 0.05em;
    }

    .photo-circle {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-pink);
      box-shadow: 0 0 30px rgba(232,160,180,0.4), 0 0 60px rgba(232,160,180,0.15);
    }

    .photo-placeholder-circle {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 3px solid var(--accent-pink);
      box-shadow: 0 0 30px rgba(232,160,180,0.4), 0 0 60px rgba(232,160,180,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-style: italic;
      font-size: 0.8rem;
      text-align: center;
      padding: 1rem;
    }

    .roy-note {
      font-family: 'Lora', serif;
      font-style: italic;
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 300px;
      text-align: center;
      line-height: 1.7;
    }

    .countdown-display {
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .countdown-unit {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      min-width: 80px;
      text-align: center;
      padding: 1rem 1.2rem;
      transition: all 0.3s ease;
    }

    .countdown-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 4rem;
      color: var(--text-light);
      line-height: 1;
      display: block;
      font-weight: 600;
    }

    .countdown-label {
      font-family: 'Lora', serif;
      font-size: 0.6rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      display: block;
      margin-top: 0.3rem;
    }

    .its-time {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 2.5rem;
      color: var(--accent-pink);
      text-align: center;
    }

    .gifts-btn {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.1rem;
      color: var(--text-light);
      background: transparent;
      border: 1px solid var(--accent-pink);
      border-radius: 50px;
      padding: 0.9rem 2.8rem;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.4s ease-out;
      margin-top: 0.5rem;
      letter-spacing: 0.05em;
    }

    .gifts-btn::before {
      content: '';
      position: absolute;
      top: -2px; left: -100%;
      width: 60%;
      height: calc(100% + 4px);
      background: linear-gradient(90deg, transparent, rgba(232,160,180,0.4), transparent);
      animation: shimmer-sweep 2.5s infinite;
    }

    @keyframes shimmer-sweep {
      0%   { left: -100%; }
      100% { left: 200%;  }
    }

    .gifts-btn:hover {
      background: linear-gradient(135deg, rgba(232,160,180,0.15), rgba(192,57,43,0.1));
      box-shadow: 0 0 25px rgba(232,160,180,0.3);
      transform: scale(1.03);
    }

    .gifts-btn.unlocked {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      box-shadow: 0 0 20px rgba(212,168,83,0.3);
    }

    /* ── Popup backdrop (pure dark overlay, no flex centering needed) ── */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .popup-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    /* ── Popup box: centered via transform, independent of parent layout ── */
    .popup-box {
      position: fixed;
      top: 50%;
      left: 50%;
      /* (1) Transform-based centering — reliable on every screen size */
      transform: translate(-50%, -50%);
      z-index: 201;
      background: #080005;
      border-radius: 24px;
      padding: 2.5rem 3rem;
      /* Never overflows viewport on any phone */
      width: min(420px, calc(100vw - 2rem));
      box-shadow: 0 0 40px rgba(232,160,180,0.35),
                  0 0 80px rgba(192,57,43,0.2),
                  inset 0 1px 0 rgba(255,255,255,0.05);
      overflow: hidden;    /* clips floating hearts at top edge */
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .popup-box.active {
      opacity: 1;
      pointer-events: all;
      /* Pulse keeps the translate; overriding transform in keyframes preserves centering */
      animation: popup-pulse 3s ease-in-out infinite;
    }

    /* (1 cont.) Pulse must carry the translate so it doesn't lose centering */
    @keyframes popup-pulse {
      0%,100% { transform: translate(-50%, -50%) scale(1); }
      50%      { transform: translate(-50%, -50%) scale(1.012); }
    }

    .popup-text {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.8rem;
      color: var(--text-light);
      text-align: center;
      min-height: 2.5em;
    }

    .popup-subtext {
      font-family: 'Lora', serif;
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
      opacity: 0;
      transition: opacity 0.6s ease;   /* (2) fade-in over 600ms */
      margin-top: 1rem;
    }
    .popup-subtext.visible { opacity: 1; }

    /* (4) Close button — 32×32px tap target, 12px from edges */
    .popup-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.06);
      border: none;
      border-radius: 50%;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease, color 0.3s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      line-height: 1;
    }
    .popup-close:hover,
    .popup-close:focus { background: rgba(255,255,255,0.12); color: var(--text-light); outline: none; }

    /* (3) Hearts inside popup — 10-14px, drift upward 3.5s, clipped by overflow:hidden */
    @keyframes popup-heart-rise {
      0%   { transform: translateY(0);        opacity: 0.7; }
      20%  { opacity: 0.6; }
      100% { transform: translateY(-280px);   opacity: 0; }
    }
    .popup-heart {
      position: absolute;
      pointer-events: none;
      color: var(--accent-pink);
      bottom: 16px;
      animation: popup-heart-rise linear infinite;
    }

    /* (6) Post-close one-shot shimmer on the gifts button */
    @keyframes btn-shimmer-once {
      0%   { left: -120%; opacity: 0; }
      10%  { opacity: 1; }
      100% { left: 220%;  opacity: 0; }
    }
    .gifts-btn.shimmer-once::after {
      content: '';
      position: absolute;
      top: -2px; left: -120%;
      width: 55%;
      height: calc(100% + 4px);
      background: linear-gradient(90deg, transparent, rgba(232,160,180,0.6), transparent);
      animation: btn-shimmer-once 1.2s ease-out forwards;
    }

    @media (max-width: 768px) {
      .countdown-num { font-size: 2.5rem; }
      .countdown-unit { min-width: 60px; padding: 0.7rem 0.9rem; }
      .main-content { gap: 1.2rem; }
      .for-label { font-size: 1.1rem; }
    }

    /* ── 390px (iPhone 14 / small phones) ── */
    @media (max-width: 430px) {
      body { overflow-x: hidden; }

      .lyrics-container { overflow: hidden; }

      .main-content {
        padding: 1rem 0.75rem;
        gap: 1rem;
        justify-content: center;
      }

      /* Photo never overflows viewport */
      .photo-placeholder-circle,
      .photo-circle {
        width: min(140px, 38vw);
        height: min(140px, 38vw);
        flex-shrink: 0;
      }

      /* Countdown: 4 boxes fit on one row at 390px */
      .countdown-display {
        gap: 0.5rem;
        flex-wrap: nowrap;          /* keep on one line */
      }
      .countdown-unit {
        min-width: 0;
        width: calc(25vw - 0.5rem); /* quarter-screen minus gap */
        padding: 0.6rem 0.5rem;
      }
      .countdown-num {
        font-size: clamp(1.6rem, 6vw, 2.2rem);
      }
      .countdown-label {
        font-size: 0.5rem;
        letter-spacing: 0.1em;
      }

      /* Button full-width pill, easy to tap */
      .gifts-btn {
        width: 90%;
        min-height: 52px;
        font-size: 1rem;
        padding: 0.8rem 1.5rem;
      }

      /* Popup: tighter padding on small phones */
      .popup-box {
        padding: 2rem 1.5rem;
      }
      .popup-text { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <!-- Particles background -->
  <div id="particles-js"></div>

  <!-- Lyrics drifting across screen -->
  <div class="lyrics-container" id="lyrics-container"></div>

  <!-- Main centred content -->
  <main class="main-content">
    <div class="for-label entrance-1">for arushi, with everything</div>

    <!-- Photo (Roy will replace src) -->
    <div class="photo-placeholder-circle entrance-2" id="photo-area">
      <span>add photo:<br>arushi-main.jpg</span>
    </div>
    <!-- To use real photo, replace the div above with:
    <img src="assets/photos/arushi-main.jpg" alt="Arushi" class="photo-circle entrance-2"> -->

    <!-- Roy's note (PLACEHOLDER) -->
    <p class="roy-note entrance-3">
      <!-- PLACEHOLDER: Roy will replace this with his note -->
      every single day i find a new reason.<br>happy birthday.
    </p>

    <!-- Countdown timer -->
    <div class="countdown-display entrance-4" id="countdown-display">
      <div class="countdown-unit">
        <span class="countdown-num" id="cd-days">000</span>
        <span class="countdown-label">days</span>
      </div>
      <div class="countdown-unit">
        <span class="countdown-num" id="cd-hours">00</span>
        <span class="countdown-label">hrs</span>
      </div>
      <div class="countdown-unit">
        <span class="countdown-num" id="cd-mins">00</span>
        <span class="countdown-label">min</span>
      </div>
      <div class="countdown-unit">
        <span class="countdown-num" id="cd-secs">00</span>
        <span class="countdown-label">sec</span>
      </div>
    </div>

    <!-- Button -->
    <button class="gifts-btn entrance-5" id="gifts-btn" onclick="handleGiftsBtn()">
      open your gifts
    </button>
  </main>

  <!-- Popup backdrop (tap this to close) -->
  <div class="popup-overlay" id="popup-overlay"></div>

  <!-- Popup box — position:fixed, centred via transform (req. 1) -->
  <div class="popup-box" id="popup-box">
    <!-- (4) Close button: 32×32px, 12px from edges -->
    <button class="popup-close" id="popup-close-btn" onclick="closePopup()" aria-label="Close">×</button>

    <div class="popup-text" id="popup-text"></div>
    <div class="popup-subtext" id="popup-subtext">come back when the clock says it's time</div>

    <!-- (3) 6 small hearts, 10-14px, staggered start times, 3-4s duration each -->
    <span class="popup-heart" style="left:8%; font-size:12px; animation-duration:3.6s; animation-delay:0s;">♥</span>
    <span class="popup-heart" style="left:22%;font-size:10px; animation-duration:4.1s; animation-delay:1.2s;">♥</span>
    <span class="popup-heart" style="left:40%;font-size:14px; animation-duration:3.2s; animation-delay:0.5s;">♥</span>
    <span class="popup-heart" style="left:58%;font-size:11px; animation-duration:3.8s; animation-delay:1.8s;">♥</span>
    <span class="popup-heart" style="left:74%;font-size:13px; animation-duration:4.3s; animation-delay:0.9s;">♥</span>
    <span class="popup-heart" style="left:88%;font-size:10px; animation-duration:3.5s; animation-delay:2.3s;">♥</span>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script src="particles-config.js"></script>
  <script>
    // ── Particles ──────────────────────────────────────────────────────────
    particlesJS('particles-js', {
      particles: {
        number: { value: 40, density: { enable: true, value_area: 800 } },
        color: { value: ['#e8a0b4', '#c0392b', '#7b2d8b'] },
        shape: {
          type: 'char',
          character: { value: '♥', font: 'Verdana', style: '', weight: '400' }
        },
        opacity: { value: 0.5, random: true, anim: { enable: true, speed: 0.5, opacity_min: 0.1, sync: false } },
        size: { value: 14, random: true, anim: { enable: true, speed: 2, size_min: 6, sync: false } },
        line_linked: { enable: false },
        move: { enable: true, speed: 1.2, direction: 'top', random: true, straight: false, out_mode: 'out', bounce: false }
      },
      interactivity: {
        detect_on: 'canvas',
        events: { onhover: { enable: true, mode: 'repulse' }, onclick: { enable: false }, resize: true },
        modes: { repulse: { distance: 100, duration: 0.4 } }
      },
      retina_detect: true
    });

    // ── Lyrics ticker ──────────────────────────────────────────────────────
    var lyrics = [
      "a thousand years... I have loved you for a thousand years",
      "raataan lambiyan... teriyan meriyan",
      "until I found you, I was never whole",
      "suniyan suniyan, dil di gal suniyan",
      "heaven, I'm in heaven",
      "ik tara bole... tun tun tara",
      "because I'm happy...",
      "it's your birthday and I want it to be special",
      "my love, always"
    ];

    var container = document.getElementById('lyrics-container');

    lyrics.forEach(function(lyric, i) {
      var el = document.createElement('div');
      el.className = 'lyrics-line';
      el.textContent = lyric;
      var duration = 65 + (i % 4) * 8;
      var delay = -(i * (duration / lyrics.length));
      var vertPos = 10 + (i * 10) % 80;
      el.style.cssText = [
        'animation: drift-diagonal ' + duration + 's linear ' + delay + 's infinite',
        'bottom: ' + vertPos + '%',
        'left: 0'
      ].join(';');
      container.appendChild(el);
    });

    // ── Countdown ─────────────────────────────────────────────────────────
    var target = new Date('2026-06-12T00:00:00+03:00');
    var unlocked = false;

    function pad(n, len) {
      var s = String(n);
      while (s.length < (len || 2)) s = '0' + s;
      return s;
    }

    function updateCountdown() {
      var now  = new Date();
      var diff = target - now;

      if (diff <= 0) {
        unlocked = true;
        document.getElementById('countdown-display').innerHTML =
          "<span class='its-time'>it's time, my love 🌸</span>";
        document.getElementById('gifts-btn').classList.add('unlocked');
        clearInterval(timer);
        return;
      }

      var days = Math.floor(diff / (1000 * 60 * 60 * 24));
      var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      var mins  = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      var secs  = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('cd-days').textContent  = pad(days, 3);
      document.getElementById('cd-hours').textContent = pad(hours);
      document.getElementById('cd-mins').textContent  = pad(mins);
      document.getElementById('cd-secs').textContent  = pad(secs);
    }

    var timer = setInterval(updateCountdown, 1000);
    updateCountdown();

    // ── Button handler ────────────────────────────────────────────────────
    function handleGiftsBtn() {
      if (unlocked) {
        window.location.href = 'gifts.html';
      } else {
        showPopup();
      }
    }

    // ── Popup ─────────────────────────────────────────────────────────────
    var typewriterTimer = null;

    function showPopup() {
      var overlay = document.getElementById('popup-overlay');
      var box     = document.getElementById('popup-box');

      // Reset before re-opening
      document.getElementById('popup-text').textContent = '';
      document.getElementById('popup-subtext').classList.remove('visible');

      overlay.classList.add('active');
      box.classList.add('active');

      // (2) 80ms per char — more dramatic; subtext appears 1500ms AFTER typing ends
      typewriter(
        document.getElementById('popup-text'),
        "you're still 19 baby 🥺",
        80,
        function() {
          setTimeout(function() {
            document.getElementById('popup-subtext').classList.add('visible');
          }, 1500);
        }
      );
    }

    function closePopup() {
      var overlay = document.getElementById('popup-overlay');
      var box     = document.getElementById('popup-box');

      overlay.classList.remove('active');
      box.classList.remove('active');

      if (typewriterTimer) { clearTimeout(typewriterTimer); typewriterTimer = null; }

      // (6) One-shot shimmer on button after popup closes
      var btn = document.getElementById('gifts-btn');
      btn.classList.remove('shimmer-once');
      void btn.offsetWidth;                  // force reflow so animation restarts
      btn.classList.add('shimmer-once');
      btn.addEventListener('animationend', function onShimmerEnd() {
        btn.classList.remove('shimmer-once');
        btn.removeEventListener('animationend', onShimmerEnd);
      });
    }

    function typewriter(el, text, ms, cb) {
      el.textContent = '';
      var i = 0;
      function tick() {
        if (i < text.length) {
          el.textContent += text[i++];
          typewriterTimer = setTimeout(tick, ms);
        } else {
          typewriterTimer = null;
          if (cb) cb();
        }
      }
      tick();
    }

    // (5) Tap anywhere on the dark backdrop to close
    document.getElementById('popup-overlay').addEventListener('click', closePopup);

    // ── GSAP entrance animations ──────────────────────────────────────────
    gsap.set('.entrance-1,.entrance-2,.entrance-3,.entrance-4,.entrance-5',
      { opacity: 0, y: 24 });
    gsap.to('.entrance-1', { opacity: 1, y: 0, duration: 0.7, delay: 0.2, ease: 'power2.out' });
    gsap.to('.entrance-2', { opacity: 1, y: 0, duration: 0.7, delay: 0.4, ease: 'power2.out' });
    gsap.to('.entrance-3', { opacity: 1, y: 0, duration: 0.7, delay: 0.6, ease: 'power2.out' });
    gsap.to('.entrance-4', { opacity: 1, y: 0, duration: 0.7, delay: 0.8, ease: 'power2.out' });
    gsap.to('.entrance-5', { opacity: 1, y: 0, duration: 0.7, delay: 1.0, ease: 'power2.out' });
  </script>
</body>
</html>
