<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You, In Motion · Arushi Turns Twenty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Dancing+Script:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    :root {
      --bg-dark: #0d0a0f;
      --bg-mid: #1a0f1e;
      --bg-card: #221528;
      --accent-pink: #e8a0b4;
      --accent-gold: #d4a853;
      --text-light: #f5f0eb;
      --text-muted: #9e8a9e;
      --text-warm: #e8ddd0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Lora', serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #particles-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .page-content {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.5rem 6rem;
    }

    .back-btn {
      display: inline-block;
      font-family: 'Lora', serif;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      letter-spacing: 0.05em;
      margin-bottom: 2.5rem;
      transition: color 0.3s;
    }
    .back-btn:hover { color: var(--accent-pink); }

    .page-header {
      text-align: center;
      margin-bottom: 0.6rem;
    }
    .page-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: 300;
      font-style: italic;
      color: var(--text-light);
      line-height: 1.2;
    }

    .header-accent {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      margin: 0.9rem auto 2.5rem;
      max-width: 200px;
    }
    .header-accent-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(232,160,180,0.4));
    }
    .header-accent-line.rev {
      background: linear-gradient(90deg, rgba(232,160,180,0.4), transparent);
    }
    .header-accent-diamond {
      width: 6px;
      height: 6px;
      background: var(--accent-pink);
      transform: rotate(45deg);
      opacity: 0.6;
    }

    /* Video card */
    .video-container {
      max-width: 900px;
      margin: 2rem auto;
      background: var(--bg-card);
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(232,160,180,0.35);
      box-shadow:
        0 0 30px rgba(232,160,180,0.15),
        0 0 60px rgba(232,160,180,0.06),
        0 20px 60px rgba(0,0,0,0.5);
      position: relative;
    }

    .ambient-dot {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(60px);
      z-index: 0;
    }
    .ambient-dot-1 {
      width: 300px; height: 300px;
      background: rgba(232,160,180,0.04);
      top: -80px; right: -60px;
    }
    .ambient-dot-2 {
      width: 250px; height: 250px;
      background: rgba(123,45,139,0.04);
      bottom: -60px; left: -40px;
    }

    /* Native video element */
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0a0006;
      z-index: 1;
    }

    .video-wrapper video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }

    /* Bottom bar */
    .video-bar {
      padding: 0.7rem 1.2rem;
      background: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(232,160,180,0.1);
      position: relative;
      z-index: 1;
    }
    .video-bar-label {
      font-family: 'Lora', serif;
      font-size: 0.75rem;
      font-style: italic;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }
    .video-bar-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'Lora', serif;
      font-size: 0.7rem;
      color: rgba(232,160,180,0.5);
      letter-spacing: 0.08em;
    }
    .video-bar-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent-pink);
      opacity: 0.5;
    }

    /* Custom volume bar — desktop only (mobile uses hardware volume) */
    .volume-row {
      padding: 0.55rem 1.2rem;
      background: rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 0.7rem;
      border-top: 1px solid rgba(255,255,255,0.04);
      position: relative;
      z-index: 1;
    }
    @media (hover: none) and (pointer: coarse) {
      .volume-row { display: none; }
    }
    .volume-icon {
      color: var(--text-muted);
      font-size: 0.85rem;
      user-select: none;
      flex-shrink: 0;
      width: 1.1rem;
      text-align: center;
    }
    .volume-label {
      font-family: 'Lora', serif;
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .volume-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.1);
      outline: none;
      cursor: pointer;
      background: linear-gradient(to right, rgba(232,160,180,0.7) 0%, rgba(232,160,180,0.7) 80%, rgba(255,255,255,0.1) 80%);
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px; height: 13px;
      border-radius: 50%;
      background: var(--accent-pink);
      cursor: pointer;
      box-shadow: 0 0 6px rgba(232,160,180,0.5);
    }
    .volume-slider::-moz-range-thumb {
      width: 13px; height: 13px;
      border-radius: 50%;
      background: var(--accent-pink);
      cursor: pointer;
      border: none;
      box-shadow: 0 0 6px rgba(232,160,180,0.5);
    }
    .volume-pct {
      font-family: 'Lora', serif;
      font-size: 0.65rem;
      color: rgba(232,160,180,0.5);
      width: 2.2rem;
      text-align: right;
      flex-shrink: 0;
    }

    .video-caption {
      text-align: center;
      margin-top: 1.5rem;
      font-family: 'Lora', serif;
      font-size: 1rem;
      font-style: italic;
      color: var(--text-muted);
      letter-spacing: 0.03em;
      line-height: 1.6;
    }

    .ornament {
      text-align: center;
      margin-top: 3rem;
    }
    .ornament-inner {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    .ornament-line-h {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,168,83,0.3), transparent);
    }
    .ornament-text {
      font-family: 'Dancing Script', cursive;
      font-size: 1.1rem;
      color: var(--accent-gold);
      opacity: 0.4;
      letter-spacing: 0.06em;
    }

    @media (max-width: 600px) {
      .video-container { border-radius: 12px; border-width: 1.5px; }
    }
  </style>
</head>
<body>

  <div id="particles-bg"></div>

  <div class="page-content">
    <a href="../gifts.html" class="back-btn">← back to gifts</a>

    <div class="page-header">
      <h1>you, in motion.</h1>
    </div>

    <div class="header-accent">
      <div class="header-accent-line"></div>
      <div class="header-accent-diamond"></div>
      <div class="header-accent-line rev"></div>
    </div>

    <div class="video-container" id="videoContainer">
      <div class="ambient-dot ambient-dot-1"></div>
      <div class="ambient-dot ambient-dot-2"></div>

      <div class="video-wrapper">
        <video
          controls
          preload="metadata"
          playsinline
          controlslist="nodownload"
          src="../assets/videos/arushi-edit.mp4">
          Your browser doesn't support the video tag.
        </video>
      </div>

      <div class="video-bar">
        <span class="video-bar-label">for arushi · twenty</span>
        <div class="video-bar-badge">
          <div class="video-bar-dot"></div>
          <span>made with love</span>
        </div>
      </div>

      <div class="volume-row">
        <span class="volume-icon" id="volIcon">&#128266;</span>
        <span class="volume-label">volume</span>
        <input type="range" class="volume-slider" id="volSlider" min="0" max="100" value="80" />
        <span class="volume-pct" id="volPct">80%</span>
      </div>
    </div>

    <p class="video-caption">made with love.</p>

    <div class="ornament">
      <div class="ornament-inner">
        <div class="ornament-line-h"></div>
        <div class="ornament-text">with love, always</div>
        <div class="ornament-line-h"></div>
      </div>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script src="../particles-config.js"></script>

  <script>
    if (typeof initParticles === 'function') {
      initParticles('particles-bg', 'light');
    } else if (typeof particlesJS === 'function') {
      particlesJS('particles-bg', {
        particles: {
          number: { value: 30, density: { enable: true, value_area: 900 } },
          color: { value: ['#e8a0b4', '#d4a853', '#c8b0d8'] },
          shape: { type: 'circle' },
          opacity: { value: 0.3, random: true },
          size: { value: 2, random: true },
          line_linked: { enable: false },
          move: { enable: true, speed: 0.4, random: true, out_mode: 'out' }
        },
        interactivity: { detect_on: 'canvas', events: { resize: true } },
        retina_detect: true
      });
    }

    // Volume control
    var vid = document.querySelector('video');
    var slider = document.getElementById('volSlider');
    var pctEl = document.getElementById('volPct');
    var iconEl = document.getElementById('volIcon');

    function updateSliderTrack(val) {
      slider.style.background = 'linear-gradient(to right, rgba(232,160,180,0.7) 0%, rgba(232,160,180,0.7) ' + val + '%, rgba(255,255,255,0.1) ' + val + '%)';
    }

    function updateIcon(vol) {
      if (vol === 0) { iconEl.innerHTML = '&#128263;'; }
      else if (vol < 40) { iconEl.innerHTML = '&#128264;'; }
      else if (vol < 70) { iconEl.innerHTML = '&#128265;'; }
      else { iconEl.innerHTML = '&#128266;'; }
    }

    vid.volume = 0.8;

    slider.addEventListener('input', function() {
      var val = parseInt(this.value);
      vid.volume = val / 100;
      vid.muted = val === 0;
      pctEl.textContent = val + '%';
      updateSliderTrack(val);
      updateIcon(val);
    });

    // Sync icon if video muted externally
    vid.addEventListener('volumechange', function() {
      var val = Math.round(vid.volume * 100);
      if (vid.muted) val = 0;
      slider.value = val;
      pctEl.textContent = val + '%';
      updateSliderTrack(val);
      updateIcon(val);
    });

    updateSliderTrack(80);

    if (typeof gsap !== 'undefined') {
      gsap.from('.page-header h1', { duration: 1, opacity: 0, y: 24, ease: 'power3.out', delay: 0.2 });
      gsap.from('.video-container',  { duration: 1.2, opacity: 0, y: 36, ease: 'power3.out', delay: 0.4 });
      gsap.from('.video-caption',    { duration: 0.9, opacity: 0, y: 16, ease: 'power2.out', delay: 0.9 });
      gsap.from('.ornament',         { duration: 0.9, opacity: 0,         ease: 'power2.out', delay: 1.1 });
    }
  </script>
</body>
</html>
