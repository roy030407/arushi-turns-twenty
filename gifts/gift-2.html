<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>From Me, To You · Arushi Turns Twenty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Dancing+Script:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    :root {
      --bg-dark: #0d0a0f;
      --bg-mid: #1a0f1e;
      --bg-card: #221528;
      --accent-pink: #e8a0b4;
      --accent-gold: #d4a853;
      --accent-purple: #7b2d8b;
      --text-light: #f5f0eb;
      --text-muted: #9e8a9e;
      --text-warm: #e8ddd0;
      --glass-border: rgba(255,255,255,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Lora', serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #particles-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .page-content {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.5rem 6rem;
    }

    .back-btn {
      display: inline-block;
      font-family: 'Lora', serif;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      letter-spacing: 0.05em;
      margin-bottom: 2.5rem;
      transition: color 0.3s;
    }
    .back-btn:hover { color: var(--accent-pink); }

    .page-header {
      text-align: center;
      margin-bottom: 0.6rem;
    }
    .page-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: 300;
      font-style: italic;
      color: var(--text-light);
      line-height: 1.2;
    }

    .header-accent {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      margin: 0.9rem auto 2.5rem;
      max-width: 200px;
    }
    .accent-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(232,160,180,0.4));
    }
    .accent-line.rev {
      background: linear-gradient(90deg, rgba(232,160,180,0.4), transparent);
    }
    .accent-diamond {
      width: 6px; height: 6px;
      background: var(--accent-pink);
      transform: rotate(45deg);
      opacity: 0.6;
    }

    .video-container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--bg-card);
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(232,160,180,0.35);
      box-shadow:
        0 0 30px rgba(232,160,180,0.15),
        0 0 60px rgba(232,160,180,0.06),
        0 20px 60px rgba(0,0,0,0.5);
    }

    .video-wrapper {
      width: 100%;
      background: #000;
    }

    .video-wrapper video {
      width: 100%;
      display: block;
      max-height: 80vh;
      object-fit: contain;
      background: #000;
    }

    .video-bar {
      padding: 0.7rem 1.2rem;
      background: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(232,160,180,0.1);
    }
    .video-bar-label {
      font-family: 'Lora', serif;
      font-size: 0.75rem;
      font-style: italic;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }
    .video-bar-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'Lora', serif;
      font-size: 0.7rem;
      color: rgba(232,160,180,0.5);
      letter-spacing: 0.08em;
    }
    .video-bar-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent-pink);
      opacity: 0.5;
    }

    .video-caption {
      text-align: center;
      margin-top: 1.8rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-style: italic;
      font-weight: 300;
      color: var(--text-warm);
      letter-spacing: 0.03em;
      line-height: 1.6;
    }

    .ornament {
      text-align: center;
      margin-top: 2.5rem;
    }
    .ornament-inner {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    .ornament-line-h {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,168,83,0.3), transparent);
    }
    .ornament-text {
      font-family: 'Dancing Script', cursive;
      font-size: 1.1rem;
      color: var(--accent-gold);
      opacity: 0.4;
      letter-spacing: 0.06em;
    }

    @media (max-width: 600px) {
      .video-container { border-radius: 12px; border-width: 1.5px; }
    }
  </style>
</head>
<body>

  <div id="particles-bg"></div>

  <div class="page-content">
    <a href="../gifts.html" class="back-btn">← back to gifts</a>

    <div class="page-header">
      <h1>from me. to you.</h1>
    </div>

    <div class="header-accent">
      <div class="accent-line"></div>
      <div class="accent-diamond"></div>
      <div class="accent-line rev"></div>
    </div>

    <div class="video-container">
      <div class="video-wrapper">
        <video controls playsinline preload="metadata">
          <source src="../assets/videos/from-roy.mp4" type="video/mp4">
        </video>
      </div>
      <div class="video-bar">
        <span class="video-bar-label">for arushi · twenty</span>
        <div class="video-bar-badge">
          <div class="video-bar-dot"></div>
          <span>made with love</span>
        </div>
      </div>
    </div>

    <p class="video-caption">some things are better said out loud.</p>

    <div class="ornament">
      <div class="ornament-inner">
        <div class="ornament-line-h"></div>
        <div class="ornament-text">with love, always</div>
        <div class="ornament-line-h"></div>
      </div>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script src="../particles-config.js"></script>

  <script>
    if (typeof initParticles === 'function') {
      initParticles('particles-bg', 'light');
    } else if (typeof particlesJS === 'function') {
      particlesJS('particles-bg', {
        particles: {
          number: { value: 30, density: { enable: true, value_area: 900 } },
          color: { value: ['#e8a0b4', '#d4a853', '#c8b0d8'] },
          shape: { type: 'circle' },
          opacity: { value: 0.3, random: true },
          size: { value: 2, random: true },
          line_linked: { enable: false },
          move: { enable: true, speed: 0.4, random: true, out_mode: 'out' }
        },
        interactivity: { detect_on: 'canvas', events: { resize: true } },
        retina_detect: true
      });
    }

    if (typeof gsap !== 'undefined') {
      gsap.from('.page-header h1', { duration: 1, opacity: 0, y: 24, ease: 'power3.out', delay: 0.2 });
      gsap.from('.video-container',  { duration: 1.2, opacity: 0, y: 36, ease: 'power3.out', delay: 0.4 });
      gsap.from('.video-caption',    { duration: 0.9, opacity: 0, y: 16, ease: 'power2.out', delay: 0.9 });
      gsap.from('.ornament',         { duration: 0.9, opacity: 0,         ease: 'power2.out', delay: 1.1 });
    }
  </script>
</body>
</html>
