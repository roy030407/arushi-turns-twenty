<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Puzzle Box — Arushi Turns Twenty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <style>
    :root {
      --bg-dark: #0d0a0f;
      --bg-mid: #1a0f1e;
      --bg-card: #221528;
      --accent-red: #c0392b;
      --accent-purple: #7b2d8b;
      --accent-pink: #e8a0b4;
      --accent-gold: #d4a853;
      --text-light: #f5f0eb;
      --text-muted: #9e8a9e;
      --text-warm: #e8ddd0;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      font-family: 'Lora', serif;
      overflow-x: hidden;
    }

    .page-header {
      text-align: center;
      padding: 5rem 2rem 1.5rem;
    }

    .page-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 300;
      color: var(--text-light);
      letter-spacing: 0.05em;
    }

    .page-header p {
      font-family: 'Lora', serif;
      font-style: italic;
      color: var(--text-muted);
      margin-top: 0.5rem;
      font-size: 1rem;
    }

    .progress-tracker {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 2rem 0;
    }

    .progress-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--glass-border);
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lora', serif;
      font-size: 0.85rem;
      color: var(--text-muted);
      transition: all 0.5s ease;
    }

    .progress-circle.solved {
      border-color: var(--accent-gold);
      background: rgba(212, 168, 83, 0.15);
      color: var(--accent-gold);
    }

    .riddle-area {
      max-width: 640px;
      margin: 0 auto;
      padding: 1.5rem 2rem 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .riddle-screen {
      width: 100%;
      text-align: center;
    }

    .riddle-number {
      font-family: 'Lora', serif;
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .riddle-text {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1.3rem, 3vw, 1.8rem);
      color: var(--text-light);
      line-height: 1.7;
      max-width: 600px;
      margin: 0 auto 2rem;
    }

    .riddle-input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: 100%;
    }

    .riddle-input {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 0.8rem 1.2rem;
      color: var(--text-light);
      font-family: 'Lora', serif;
      font-size: 1rem;
      text-align: center;
      text-transform: uppercase;
      width: 100%;
      max-width: 300px;
      outline: none;
      letter-spacing: 0.1em;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .riddle-input:focus {
      border-color: var(--accent-pink);
      box-shadow: 0 0 0 2px rgba(232, 160, 180, 0.1);
    }

    .riddle-input.correct-flash {
      border-color: #4caf50;
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
    }

    .riddle-input.wrong-flash {
      border-color: var(--accent-red);
      color: var(--accent-red);
      animation: shake 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .submit-btn {
      padding: 0.7rem 2rem;
      border-radius: 30px;
      border: 1px solid var(--accent-pink);
      background: transparent;
      color: var(--accent-pink);
      font-family: 'Lora', serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.3s, color 0.3s, transform 0.2s;
      letter-spacing: 0.05em;
    }

    .submit-btn:hover {
      background: var(--accent-pink);
      color: var(--bg-dark);
    }

    .submit-btn:active {
      transform: scale(0.96);
    }

    .hint-btn {
      padding: 0.5rem 1.5rem;
      border-radius: 30px;
      border: 1px solid var(--text-muted);
      background: transparent;
      color: var(--text-muted);
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s;
      opacity: 0;
      pointer-events: none;
    }

    .hint-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .hint-btn:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    .hint-text {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 0.9rem;
      color: var(--accent-gold);
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: opacity 0.5s, max-height 0.5s;
      text-align: center;
      max-width: 400px;
    }

    .hint-text.visible {
      opacity: 1;
      max-height: 3rem;
    }

    .unlock-message {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.3rem;
      color: var(--accent-pink);
      text-align: center;
      opacity: 0;
      margin-top: 1rem;
    }

    .final-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 480px;
      margin: 0 auto;
      display: none;
    }

    .final-card h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      font-weight: 300;
      color: var(--text-light);
      margin-bottom: 1.5rem;
    }

    .final-card p {
      font-family: 'Lora', serif;
      font-style: italic;
      color: var(--text-muted);
      margin-bottom: 2rem;
      line-height: 1.7;
    }

    .final-link {
      padding: 0.75rem 2rem;
      border-radius: 30px;
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      text-decoration: none;
      font-family: 'Lora', serif;
      font-size: 0.95rem;
      display: inline-block;
      transition: background 0.3s, color 0.3s;
    }

    .final-link:hover {
      background: var(--accent-gold);
      color: var(--bg-dark);
    }

    .wrong-count-indicator {
      font-family: 'Lora', serif;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="particles-bg" style="position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.3"></div>

  <a href="../gifts.html" style="position:fixed;top:1.2rem;left:1.5rem;font-family:'Lora',serif;color:var(--text-muted);text-decoration:none;z-index:100;font-size:0.9rem;transition:color 0.3s">← back to gifts</a>

  <div class="page-content" style="position:relative;z-index:1">
    <div class="page-header">
      <h1>a locked box. for the curious.</h1>
      <p>five riddles. solve each to unlock the next.</p>
    </div>

    <div class="progress-tracker" id="progressTracker">
      <div class="progress-circle" id="pc-0">1</div>
      <div class="progress-circle" id="pc-1">2</div>
      <div class="progress-circle" id="pc-2">3</div>
      <div class="progress-circle" id="pc-3">4</div>
      <div class="progress-circle" id="pc-4">5</div>
    </div>

    <div class="riddle-area" id="riddleArea">
      <div class="riddle-screen" id="riddleScreen"></div>
      <div class="final-card" id="finalCard">
        <h2>all five. every single one.</h2>
        <p>you found your way through every one of them.</p>
        <a class="final-link" href="../gifts/gift-4.html">go read the poem →</a>
      </div>
    </div>
  </div>

  <script src="../particles-config.js"></script>
  <script>
    if (typeof initParticles === 'function') initParticles('particles-bg', 'light');

    const RIDDLES = [
      {
        riddle: "[PLACEHOLDER RIDDLE 1 — Roy writes a riddle based on a shared memory or inside joke. Answer should be a single word.]",
        answer: "ANSWER1",
        hint: "[PLACEHOLDER: A gentle hint Roy will write]",
        unlockMsg: "[A sweet/funny one-liner that appears when she gets it right]"
      },
      {
        riddle: "[PLACEHOLDER RIDDLE 2]",
        answer: "ANSWER2",
        hint: "[PLACEHOLDER HINT 2]",
        unlockMsg: "[Sweet line 2]"
      },
      {
        riddle: "[PLACEHOLDER RIDDLE 3]",
        answer: "ANSWER3",
        hint: "[PLACEHOLDER HINT 3]",
        unlockMsg: "[Sweet line 3]"
      },
      {
        riddle: "[PLACEHOLDER RIDDLE 4]",
        answer: "ANSWER4",
        hint: "[PLACEHOLDER HINT 4]",
        unlockMsg: "[Sweet line 4]"
      },
      {
        riddle: "[PLACEHOLDER RIDDLE 5 — the final one. Answer leads her somewhere.]",
        answer: "ANSWER5",
        hint: "[PLACEHOLDER HINT 5]",
        unlockMsg: "you did it. all five. — go read the poem."
      }
    ];

    let currentRiddle = 0;
    let wrongAttempts = 0;
    let hintShown = false;

    function renderRiddle(index) {
      const riddle = RIDDLES[index];
      const screen = document.getElementById('riddleScreen');

      const html = `
        <div class="riddle-number">riddle ${index + 1} of ${RIDDLES.length}</div>
        <div class="riddle-text" id="riddleText">${riddle.riddle}</div>
        <div class="riddle-input-group">
          <input
            type="text"
            class="riddle-input"
            id="riddleInput"
            placeholder="your answer"
            autocomplete="off"
            spellcheck="false"
          />
          <button class="submit-btn" id="submitBtn">submit</button>
          <span class="wrong-count-indicator" id="wrongCountIndicator"></span>
          <button class="hint-btn" id="hintBtn" onclick="showHint()">show hint</button>
          <div class="hint-text" id="hintText">${riddle.hint}</div>
          <div class="unlock-message" id="unlockMsg"></div>
        </div>
      `;

      screen.innerHTML = html;
      screen.style.opacity = '0';
      gsap.to(screen, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' });

      document.getElementById('riddleInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') submitAnswer();
      });
      document.getElementById('submitBtn').addEventListener('click', submitAnswer);

      wrongAttempts = 0;
      hintShown = false;
    }

    function showHint() {
      const hintText = document.getElementById('hintText');
      const hintBtn = document.getElementById('hintBtn');
      if (!hintShown) {
        hintText.classList.add('visible');
        hintBtn.textContent = '(hint shown)';
        hintShown = true;
      }
    }

    function submitAnswer() {
      const input = document.getElementById('riddleInput');
      const val = input.value.trim().toUpperCase();
      const correct = RIDDLES[currentRiddle].answer.toUpperCase();

      if (!val) return;

      if (val === correct) {
        handleCorrect();
      } else {
        handleWrong(input);
      }
    }

    function handleCorrect() {
      const input = document.getElementById('riddleInput');
      const submitBtn = document.getElementById('submitBtn');
      const unlockMsg = document.getElementById('unlockMsg');

      input.classList.add('correct-flash');
      input.disabled = true;
      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.4';

      unlockMsg.textContent = RIDDLES[currentRiddle].unlockMsg;
      gsap.to(unlockMsg, { opacity: 1, duration: 0.7, ease: 'power2.out' });

      const pc = document.getElementById('pc-' + currentRiddle);
      setTimeout(() => pc.classList.add('solved'), 300);

      if (currentRiddle < RIDDLES.length - 1) {
        setTimeout(() => {
          const screen = document.getElementById('riddleScreen');
          gsap.to(screen, {
            opacity: 0,
            x: -40,
            duration: 0.5,
            ease: 'power2.in',
            onComplete: () => {
              currentRiddle++;
              screen.style.transform = 'translateX(40px)';
              gsap.to(screen, { x: 0, duration: 0.1 });
              renderRiddle(currentRiddle);
            }
          });
        }, 2000);
      } else {
        setTimeout(() => showFinal(), 2000);
      }
    }

    function handleWrong(input) {
      wrongAttempts++;
      input.classList.remove('wrong-flash');
      void input.offsetWidth;
      input.classList.add('wrong-flash');
      input.value = '';

      setTimeout(() => {
        input.classList.remove('wrong-flash');
      }, 600);

      const indicator = document.getElementById('wrongCountIndicator');
      if (wrongAttempts >= 3) {
        indicator.textContent = `${wrongAttempts} attempts — hint available below`;
        const hintBtn = document.getElementById('hintBtn');
        hintBtn.classList.add('visible');
        gsap.fromTo(hintBtn, { opacity: 0 }, { opacity: 1, duration: 0.5 });
      } else {
        indicator.textContent = wrongAttempts + ' wrong attempt' + (wrongAttempts > 1 ? 's' : '');
      }
    }

    function showFinal() {
      const screen = document.getElementById('riddleScreen');
      const finalCard = document.getElementById('finalCard');

      gsap.to(screen, {
        opacity: 0,
        duration: 0.5,
        onComplete: () => {
          screen.style.display = 'none';
          finalCard.style.display = 'block';
          gsap.fromTo(finalCard, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out' });
        }
      });
    }

    function init() {
      renderRiddle(0);
      gsap.fromTo('.page-header h1', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 1, ease: 'power3.out' });
      gsap.fromTo('.progress-tracker', { opacity: 0 }, { opacity: 1, duration: 0.8, delay: 0.3 });
    }

    init();
  </script>
</body>
</html>
