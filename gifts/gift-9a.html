<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Her Journey — Arushi Turns Twenty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <style>
    :root {
      --bg-dark: #0d0a0f;
      --bg-mid: #1a0f1e;
      --bg-card: #221528;
      --accent-red: #c0392b;
      --accent-purple: #7b2d8b;
      --accent-pink: #e8a0b4;
      --accent-gold: #d4a853;
      --text-light: #f5f0eb;
      --text-muted: #9e8a9e;
      --text-warm: #e8ddd0;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      font-family: 'Lora', serif;
      overflow-x: hidden;
    }

    .page-header {
      text-align: center;
      padding: 5rem 2rem 2rem;
    }

    .page-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 300;
      color: var(--text-light);
      letter-spacing: 0.05em;
    }

    .intro-text {
      font-family: 'Lora', serif;
      font-style: italic;
      color: var(--text-muted);
      font-size: 1rem;
      text-align: center;
      max-width: 500px;
      margin: 1rem auto 2.5rem;
      line-height: 1.7;
      padding: 0 2rem;
    }

    .video-section {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .video-wrapper {
      position: relative;
      padding-top: 56.25%;
      background: var(--bg-card);
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--accent-pink);
      box-shadow: 0 0 30px rgba(232, 160, 180, 0.15);
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .video-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      gap: 1rem;
    }

    .video-placeholder .film-emoji {
      font-size: 4rem;
      opacity: 0.5;
    }

    .video-placeholder p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.5rem;
      color: var(--text-muted);
      font-weight: 300;
    }

    .video-placeholder span {
      font-family: 'Lora', serif;
      font-size: 0.85rem;
      color: var(--text-muted);
      opacity: 0.6;
    }

    .continue-section {
      text-align: center;
      padding: 3rem 2rem 5rem;
    }

    .continue-btn {
      display: inline-block;
      padding: 0.85rem 2.5rem;
      border-radius: 30px;
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      text-decoration: none;
      font-family: 'Lora', serif;
      font-size: 1rem;
      transition: background 0.3s, color 0.3s, transform 0.2s, box-shadow 0.3s;
      letter-spacing: 0.05em;
    }

    .continue-btn:hover {
      background: var(--accent-gold);
      color: var(--bg-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(212, 168, 83, 0.25);
    }

    .part-label {
      font-family: 'Lora', serif;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 0.8rem;
    }

    .decorative-line {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-pink), transparent);
      margin: 2rem auto;
    }
  </style>
</head>
<body>
  <div id="particles-bg" style="position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.3"></div>

  <a href="../gifts.html" style="position:fixed;top:0.8rem;left:0.8rem;font-family:'Lora',serif;color:var(--text-muted);text-decoration:none;z-index:100;font-size:0.9rem;transition:color 0.3s;min-height:44px;min-width:44px;display:inline-flex;align-items:center;padding:0.5rem 0.75rem;border-radius:8px;-webkit-tap-highlight-color:transparent">← back to gifts</a>

  <div class="page-content" style="position:relative;z-index:1">
    <div class="page-header">
      <div class="part-label">part one</div>
      <h1>you. from the very beginning.</h1>
    </div>

    <p class="intro-text">before me. before everything. there was already her.</p>

    <div class="decorative-line"></div>

    <div class="video-section" id="videoSection">
      <!-- PLACEHOLDER: Replace VIDEO_ID_HERE with the actual YouTube video ID for the journey video -->
      <div class="video-wrapper" id="videoWrapper">
        <div class="video-placeholder" id="videoPlaceholder">
          <div class="film-emoji">🎞</div>
          <p>her journey, coming soon.</p>
          <span>replace VIDEO_ID_HERE in the source with the YouTube video ID</span>
        </div>
        <iframe
          id="journeyIframe"
          style="position:absolute;top:0;left:0;width:100%;height:100%;display:none;"
          src="https://www.youtube.com/embed/VIDEO_ID_HERE"
          title="Her Journey"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <div class="decorative-line" style="margin-top:3rem;"></div>

    <div class="continue-section">
      <a class="continue-btn" href="gift-9b.html">continue her story →</a>
    </div>
  </div>

  <script src="../particles-config.js"></script>
  <script>
    if (typeof initParticles === 'function') initParticles('particles-bg', 'light');

    // Check if video ID has been set
    (function() {
      const iframe = document.getElementById('journeyIframe');
      const placeholder = document.getElementById('videoPlaceholder');
      const src = iframe.getAttribute('src');

      if (src && !src.includes('VIDEO_ID_HERE')) {
        placeholder.style.display = 'none';
        iframe.style.display = 'block';
      }
    })();

    // Page entrance animations
    gsap.fromTo('.page-header h1',
      { opacity: 0, y: -30 },
      { opacity: 1, y: 0, duration: 1.2, ease: 'power3.out' }
    );
    gsap.fromTo('.intro-text',
      { opacity: 0 },
      { opacity: 1, duration: 1, delay: 0.4, ease: 'power2.out' }
    );
    gsap.fromTo('#videoSection',
      { opacity: 0, y: 30 },
      { opacity: 1, y: 0, duration: 0.9, delay: 0.6, ease: 'power2.out' }
    );
    gsap.fromTo('.continue-section',
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.8, delay: 1, ease: 'power2.out' }
    );
  </script>
</body>
</html>
