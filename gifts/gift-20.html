<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From Roy · Arushi Turns Twenty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Dancing+Script:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <style>
    :root {
      --bg-dark: #0d0a0f;
      --bg-mid: #1a0f1e;
      --bg-card: #221528;
      --accent-red: #c0392b;
      --accent-purple: #7b2d8b;
      --accent-pink: #e8a0b4;
      --accent-gold: #d4a853;
      --text-light: #f5f0eb;
      --text-muted: #9e8a9e;
      --text-warm: #e8ddd0;
      --glass: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Lora', serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #particles-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.15;
    }

    .page-content {
      position: relative;
      z-index: 1;
      padding: 5rem 1.5rem 6rem;
      text-align: center;
    }

    .from-label {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 2rem;
      display: block;
    }

    .video-outer {
      max-width: 900px;
      margin: 0 auto 3rem;
    }

    .video-container {
      position: relative;
      padding-top: 56.25%;
      background: var(--bg-card);
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--accent-gold);
      box-shadow: 0 0 40px rgba(212,168,83,0.2);
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .final-message {
      font-family: 'Dancing Script', cursive;
      font-size: 3rem;
      color: var(--accent-gold);
      text-align: center;
      margin-top: 3rem;
      display: block;
      line-height: 1.3;
    }

    @media (max-width: 600px) {
      .final-message {
        font-size: 2.2rem;
      }
      .page-content {
        padding: 5rem 1rem 4rem;
      }
    }
  </style>
</head>
<body>

  <div id="particles-bg"></div>

  <a href="../gifts.html" style="position:fixed;top:1.2rem;left:1.5rem;font-family:'Lora',serif;color:var(--text-muted);text-decoration:none;z-index:100;font-size:0.9rem;transition:color 0.3s ease" onmouseover="this.style.color='var(--text-light)'" onmouseout="this.style.color='var(--text-muted)'">← back to gifts</a>

  <div class="page-content">

    <span class="from-label">from me.</span>

    <div class="video-outer">

      <!-- PLACEHOLDER: Replace VIDEO_ID_HERE with Roy's YouTube video ID -->
      <div class="video-container">
        <iframe
          src="https://www.youtube.com/embed/VIDEO_ID_HERE"
          title="From Roy"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>

    </div>

    <span class="final-message">happy birthday, Arushi.</span>

  </div>

  <script src="../particles-config.js"></script>
  <script>
    if (typeof initParticles === 'function') {
      initParticles('particles-bg', 'light');
    } else if (typeof particlesJS !== 'undefined') {
      particlesJS('particles-bg', {
        particles: {
          number: { value: 40, density: { enable: true, value_area: 800 } },
          color: { value: '#d4a853' },
          shape: { type: 'circle' },
          opacity: { value: 0.2, random: true },
          size: { value: 2, random: true },
          line_linked: { enable: false },
          move: { enable: true, speed: 0.4, direction: 'none', random: true, straight: false, out_mode: 'out' }
        },
        interactivity: {
          detect_on: 'canvas',
          events: { onhover: { enable: false }, onclick: { enable: false }, resize: true }
        },
        retina_detect: true
      });
    }

    gsap.from('.from-label', {
      opacity: 0,
      y: -15,
      duration: 1,
      ease: 'power2.out',
      delay: 0.4
    });

    gsap.from('.video-outer', {
      opacity: 0,
      y: 30,
      duration: 1.2,
      ease: 'power2.out',
      delay: 0.8
    });

    gsap.from('.final-message', {
      opacity: 0,
      duration: 1,
      ease: 'power2.out',
      delay: 1.4
    });

    gsap.to('.final-message', {
      textShadow: '0 0 30px rgba(212,168,83,0.6)',
      duration: 2,
      ease: 'sine.inOut',
      yoyo: true,
      repeat: -1,
      delay: 2.5
    });
  </script>

</body>
</html>
