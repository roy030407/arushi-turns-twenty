<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Things You've Said - Arushi Turns Twenty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <style>
    :root {
      --bg-dark: #0d0a0f;
      --bg-mid: #1a0f1e;
      --bg-card: #221528;
      --accent-red: #c0392b;
      --accent-purple: #7b2d8b;
      --accent-pink: #e8a0b4;
      --accent-gold: #d4a853;
      --text-light: #f5f0eb;
      --text-muted: #9e8a9e;
      --text-warm: #e8ddd0;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      font-family: 'Lora', serif;
      overflow-x: hidden;
    }

    .page-header {
      text-align: center;
      padding: 5rem 2rem 1.5rem;
    }

    .page-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.6rem, 4vw, 2.5rem);
      font-weight: 300;
      color: var(--text-light);
      letter-spacing: 0.04em;
    }

    .page-header p {
      font-family: 'Lora', serif;
      font-style: italic;
      color: var(--text-muted);
      margin-top: 0.5rem;
      font-size: 0.95rem;
    }

    .quote-stage {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      position: relative;
      cursor: pointer;
      user-select: none;
    }

    .quote-counter {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-family: 'Lora', serif;
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .decorative-quote-open {
      font-family: 'Cormorant Garamond', serif;
      font-size: 8rem;
      line-height: 1;
      color: var(--accent-pink);
      opacity: 0.3;
      position: absolute;
      top: 1.5rem;
      left: 2rem;
      pointer-events: none;
      font-weight: 300;
    }

    .decorative-quote-close {
      font-family: 'Cormorant Garamond', serif;
      font-size: 8rem;
      line-height: 1;
      color: var(--accent-pink);
      opacity: 0.3;
      position: absolute;
      bottom: 1.5rem;
      right: 2rem;
      pointer-events: none;
      font-weight: 300;
    }

    .quote-display {
      max-width: 700px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .quote-text {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--text-light);
      line-height: 1.5;
      max-width: 700px;
      margin: 0 auto;
      transition: opacity 0.7s ease;
    }

    .quote-context {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 500px;
      margin: 1.5rem auto 0;
      line-height: 1.7;
      transition: opacity 0.7s ease;
    }

    .quote-display.fading .quote-text,
    .quote-display.fading .quote-context {
      opacity: 0;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.3s, color 0.3s, background 0.3s, transform 0.2s;
      z-index: 10;
      flex-shrink: 0;
    }

    .nav-btn:hover {
      border-color: var(--accent-pink);
      color: var(--accent-pink);
      background: rgba(232, 160, 180, 0.06);
    }

    .nav-btn:active {
      transform: translateY(-50%) scale(0.92);
    }

    .nav-prev {
      left: 0.5rem;
    }

    .nav-next {
      right: 0.5rem;
    }

    .dots-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 1.5rem 2rem 4rem;
      flex-wrap: wrap;
      max-width: 600px;
      margin: 0 auto;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--glass-border);
      border: 1px solid var(--glass-border);
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      flex-shrink: 0;
    }

    .dot.active {
      background: var(--accent-pink);
      border-color: var(--accent-pink);
      transform: scale(1.3);
    }

    .dot:hover {
      background: rgba(232, 160, 180, 0.4);
    }

    .progress-bar-container {
      width: 100%;
      max-width: 700px;
      height: 1px;
      background: var(--glass-border);
      margin: 0 auto;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple));
      transition: width 0.7s ease;
    }

    @media (max-width: 600px) {
      .decorative-quote-open,
      .decorative-quote-close {
        font-size: 5rem;
        opacity: 0.2;
      }
      .nav-prev { left: 0; }
      .nav-next { right: 0; }
    }
  </style>
</head>
<body>
  <div id="particles-bg" style="position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.3"></div>

  <a href="../gifts.html" style="position:fixed;top:0.8rem;left:0.8rem;font-family:'Lora',serif;color:var(--text-muted);text-decoration:none;z-index:100;font-size:0.9rem;transition:color 0.3s;min-height:44px;min-width:44px;display:inline-flex;align-items:center;padding:0.5rem 0.75rem;border-radius:8px;-webkit-tap-highlight-color:transparent">← back to gifts</a>

  <div class="page-content" style="position:relative;z-index:1">
    <div class="page-header">
      <h1>things you've said that I wrote down.</h1>
      <p>actual things. from your actual mouth. worth keeping.</p>
    </div>

    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progressFill" style="width: 0%"></div>
    </div>

    <div class="quote-stage" id="quoteStage">
      <div class="quote-counter" id="quoteCounter">1 / 13</div>

      <div class="decorative-quote-open">&ldquo;</div>
      <div class="decorative-quote-close">&rdquo;</div>

      <button class="nav-btn nav-prev" id="prevBtn" aria-label="Previous quote">←</button>
      <button class="nav-btn nav-next" id="nextBtn" aria-label="Next quote">→</button>

      <div class="quote-display" id="quoteDisplay">
        <div class="quote-text" id="quoteText"></div>
        <div class="quote-context" id="quoteContext"></div>
      </div>
    </div>

    <div class="dots-container" id="dotsContainer"></div>
  </div>

  <script src="../particles-config.js"></script>
  <script>
    if (typeof initParticles === 'function') initParticles('particles-bg', 'light');

    const QUOTES = [
      {
        quote: "pareshan mat karo yaar",
        context: "said with the exact energy of someone who had already solved the problem. which you had."
      },
      {
        quote: "acha khaana khaana hai",
        context: "the universal signal. everything else can wait."
      },
      {
        quote: "chomu",
        context: "affectionately. always affectionately."
      },
      {
        quote: "acha ji",
        context: "two words. infinite meanings. somehow always understood."
      },
      {
        quote: "haan ji",
        context: "very respectful - with parents, with elders. but also just in general. both of us say it. a lot."
      },
      {
        quote: "mai toh humesha se hi hot hu",
        context: "stated as fact. no argument accepted."
      },
      {
        quote: "- everything you've ever said",
        context: "worth writing down. every word of it."
      }
    ];

    const TOTAL = QUOTES.length;
    let current = 0;
    let autoTimer = null;
    let isPaused = false;
    let isTransitioning = false;

    const quoteText = document.getElementById('quoteText');
    const quoteContext = document.getElementById('quoteContext');
    const quoteDisplay = document.getElementById('quoteDisplay');
    const quoteCounter = document.getElementById('quoteCounter');
    const progressFill = document.getElementById('progressFill');
    const dotsContainer = document.getElementById('dotsContainer');
    const quoteStage = document.getElementById('quoteStage');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function buildDots() {
      dotsContainer.innerHTML = '';
      for (let i = 0; i < TOTAL; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot' + (i === 0 ? ' active' : '');
        dot.addEventListener('click', () => goTo(i));
        dotsContainer.appendChild(dot);
      }
    }

    function updateDots(index) {
      document.querySelectorAll('.dot').forEach((d, i) => {
        d.classList.toggle('active', i === index);
      });
    }

    function updateProgress(index) {
      const pct = ((index + 1) / TOTAL) * 100;
      progressFill.style.width = pct + '%';
    }

    function showQuote(index, direction) {
      if (isTransitioning) return;
      isTransitioning = true;

      const outX = direction === 'next' ? -40 : 40;
      const inX = direction === 'next' ? 40 : -40;

      gsap.to(quoteDisplay, {
        opacity: 0,
        x: outX,
        duration: 0.4,
        ease: 'power2.in',
        onComplete: () => {
          quoteText.textContent = QUOTES[index].quote;
          quoteContext.textContent = QUOTES[index].context;
          quoteCounter.textContent = (index + 1) + ' / ' + TOTAL;
          updateDots(index);
          updateProgress(index);

          gsap.fromTo(quoteDisplay,
            { opacity: 0, x: inX },
            {
              opacity: 1,
              x: 0,
              duration: 0.5,
              ease: 'power2.out',
              onComplete: () => { isTransitioning = false; }
            }
          );
        }
      });
    }

    function goTo(index, direction) {
      if (index === current || isTransitioning) return;
      const dir = index > current ? 'next' : 'prev';
      current = index;
      showQuote(current, direction || dir);
      resetAutoTimer();
    }

    function next() {
      const nextIndex = (current + 1) % TOTAL;
      const dir = 'next';
      if (isTransitioning) return;
      current = nextIndex;
      showQuote(current, dir);
    }

    function prev() {
      const prevIndex = (current - 1 + TOTAL) % TOTAL;
      if (isTransitioning) return;
      current = prevIndex;
      showQuote(current, 'prev');
    }

    function resetAutoTimer() {
      clearInterval(autoTimer);
      if (!isPaused) {
        autoTimer = setInterval(() => {
          next();
        }, 7000);
      }
    }

    // First quote - fade in without transition animation
    function initFirstQuote() {
      quoteText.textContent = QUOTES[0].quote;
      quoteContext.textContent = QUOTES[0].context;
      quoteCounter.textContent = '1 / ' + TOTAL;
      updateProgress(0);
      gsap.fromTo(quoteDisplay,
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.9, delay: 0.5, ease: 'power2.out' }
      );
    }

    prevBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      prev();
      resetAutoTimer();
    });

    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      next();
      resetAutoTimer();
    });

    quoteStage.addEventListener('click', (e) => {
      if (e.target === prevBtn || e.target === nextBtn) return;
      next();
      resetAutoTimer();
    });

    quoteStage.addEventListener('mouseenter', () => {
      isPaused = true;
      clearInterval(autoTimer);
    });

    quoteStage.addEventListener('mouseleave', () => {
      isPaused = false;
      resetAutoTimer();
    });

    // Swipe support
    let touchStartX = 0;
    quoteStage.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    quoteStage.addEventListener('touchend', (e) => {
      const diff = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 40) {
        if (diff > 0) { next(); } else { prev(); }
        resetAutoTimer();
      }
    }, { passive: true });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { next(); resetAutoTimer(); }
      if (e.key === 'ArrowLeft') { prev(); resetAutoTimer(); }
    });

    // Page entrance
    gsap.fromTo('.page-header h1',
      { opacity: 0, y: -20 },
      { opacity: 1, y: 0, duration: 1, ease: 'power3.out' }
    );
    gsap.fromTo('.page-header p',
      { opacity: 0 },
      { opacity: 1, duration: 0.8, delay: 0.3, ease: 'power2.out' }
    );

    buildDots();
    initFirstQuote();
    resetAutoTimer();
  </script>
</body>
</html>
