<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From Your Person · Arushi Turns Twenty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Dancing+Script:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <style>
    :root {
      --bg-dark: #0d0a0f;
      --bg-mid: #1a0f1e;
      --bg-card: #221528;
      --accent-red: #c0392b;
      --accent-purple: #7b2d8b;
      --accent-pink: #e8a0b4;
      --accent-gold: #d4a853;
      --text-light: #f5f0eb;
      --text-muted: #9e8a9e;
      --text-warm: #e8ddd0;
      --glass: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Lora', serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #particles-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .page-content {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 5rem 1.5rem 6rem;
      text-align: center;
    }

    .page-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: clamp(2rem, 5vw, 3rem);
      font-style: italic;
      color: var(--text-light);
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .page-subtitle {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 0.6rem;
      line-height: 1.7;
    }

    .header-accent {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      margin: 1.2rem auto 3rem;
      max-width: 200px;
    }
    .accent-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(232,160,180,0.4));
    }
    .accent-line.rev {
      background: linear-gradient(90deg, rgba(232,160,180,0.4), transparent);
    }
    .accent-diamond {
      width: 6px; height: 6px;
      background: var(--accent-pink);
      transform: rotate(45deg);
      opacity: 0.6;
    }

    /* Character grid */
    .char-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
      max-width: 800px;
      margin: 0 auto;
    }

    @media (min-width: 700px) {
      .char-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 1.2rem;
      }
    }

    .char-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 1.5px solid var(--glass-border);
      background: var(--bg-card);
      transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
      cursor: default;
      aspect-ratio: 3 / 4;
    }

    .char-card:hover {
      border-color: rgba(232,160,180,0.5);
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(232,160,180,0.12);
    }

    .char-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .char-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 1.5rem 0.8rem 0.8rem;
      background: linear-gradient(to top, rgba(13,10,15,0.92) 0%, transparent 100%);
    }

    .char-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--text-light);
      text-transform: uppercase;
    }

    .char-show {
      font-family: 'Lora', serif;
      font-size: 0.65rem;
      font-style: italic;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      margin-top: 0.2rem;
    }

    .closing-note {
      margin-top: 3.5rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.2rem, 3vw, 1.7rem);
      font-style: italic;
      font-weight: 300;
      color: var(--text-warm);
      line-height: 1.6;
      max-width: 540px;
      margin-left: auto;
      margin-right: auto;
    }

    .closing-sig {
      font-family: 'Dancing Script', cursive;
      font-size: 1.1rem;
      color: var(--accent-pink);
      opacity: 0.7;
      margin-top: 1.2rem;
    }
  </style>
</head>
<body>

  <div id="particles-bg"></div>

  <a href="../gifts.html" style="position:fixed;top:0.8rem;left:0.8rem;font-family:'Lora',serif;color:var(--text-muted);text-decoration:none;z-index:100;font-size:0.9rem;transition:color 0.3s ease;min-height:44px;min-width:44px;display:inline-flex;align-items:center;padding:0.5rem 0.75rem;border-radius:8px;-webkit-tap-highlight-color:transparent" onmouseover="this.style.color='var(--text-light)'" onmouseout="this.style.color='var(--text-muted)'">← back to gifts</a>

  <div class="page-content">

    <h1 class="page-title">the characters you are.</h1>
    <p class="page-subtitle">in every version. in every scene.</p>

    <div class="header-accent">
      <div class="accent-line"></div>
      <div class="accent-diamond"></div>
      <div class="accent-line rev"></div>
    </div>

    <div class="char-grid">

      <div class="char-card">
        <img src="../assets/photos/char-donna.jpg" alt="Donna" loading="lazy">
        <div class="char-overlay">
          <div class="char-name">Donna</div>
          <div class="char-show">Suits</div>
        </div>
      </div>

      <div class="char-card">
        <img src="../assets/photos/char-rachel.webp" alt="Rachel Green" loading="lazy">
        <div class="char-overlay">
          <div class="char-name">Rachel</div>
          <div class="char-show">Friends</div>
        </div>
      </div>

      <div class="char-card">
        <img src="../assets/photos/char-andie.jpg" alt="Andie" loading="lazy">
        <div class="char-overlay">
          <div class="char-name">Andie</div>
          <div class="char-show">Devil Wears Prada</div>
        </div>
      </div>

      <div class="char-card">
        <img src="../assets/photos/char-geet.jpg" alt="Geet" loading="lazy">
        <div class="char-overlay">
          <div class="char-name">Geet</div>
          <div class="char-show">Jab We Met</div>
        </div>
      </div>

    </div>

    <div class="closing-note">
      you contain multitudes.<br>every single one of them, wonderful.
    </div>
    <div class="closing-sig">— Roy</div>

  </div>

  <script src="../particles-config.js"></script>
  <script>
    if (typeof initParticles === 'function') {
      initParticles('particles-bg', 'light');
    } else if (typeof particlesJS !== 'undefined') {
      particlesJS('particles-bg', {
        particles: {
          number: { value: 50, density: { enable: true, value_area: 800 } },
          color: { value: ['#e8a0b4', '#d4a853', '#7b2d8b'] },
          shape: { type: 'circle' },
          opacity: { value: 0.15, random: true },
          size: { value: 2, random: true },
          line_linked: { enable: false },
          move: { enable: true, speed: 0.5, direction: 'none', random: true, straight: false, out_mode: 'out' }
        },
        interactivity: {
          detect_on: 'canvas',
          events: { onhover: { enable: false }, onclick: { enable: false }, resize: true }
        },
        retina_detect: true
      });
    }

    if (typeof gsap !== 'undefined') {
      gsap.from('.page-title', { opacity: 0, y: -20, duration: 1, ease: 'power2.out', delay: 0.3 });
      gsap.from('.page-subtitle', { opacity: 0, duration: 0.8, ease: 'power2.out', delay: 0.6 });

      document.querySelectorAll('.char-card').forEach(function(card, i) {
        gsap.from(card, { opacity: 0, y: 30, duration: 0.8, ease: 'power2.out', delay: 0.7 + i * 0.15 });
      });

      gsap.from('.closing-note', { opacity: 0, y: 16, duration: 0.9, ease: 'power2.out', delay: 1.5 });
      gsap.from('.closing-sig',  { opacity: 0, duration: 0.7, ease: 'power2.out', delay: 1.9 });
    }
  </script>

</body>
</html>
