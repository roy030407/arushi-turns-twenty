<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From Your Person - Arushi Turns Twenty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Dancing+Script:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <style>
    :root {
      --bg-dark: #0d0a0f;
      --bg-mid: #1a0f1e;
      --bg-card: #221528;
      --accent-red: #c0392b;
      --accent-purple: #7b2d8b;
      --accent-pink: #e8a0b4;
      --accent-gold: #d4a853;
      --text-light: #f5f0eb;
      --text-muted: #9e8a9e;
      --text-warm: #e8ddd0;
      --glass: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Lora', serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #particles-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .page-content {
      position: relative;
      z-index: 1;
      padding: 5rem 1.5rem 5rem;
      text-align: center;
    }

    .page-header {
      margin-bottom: 2.5rem;
    }

    .page-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: 2.4rem;
      color: var(--text-light);
      letter-spacing: 0.02em;
    }

    .page-subtitle {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
    }

    .video-outer {
      max-width: 900px;
      margin: 2rem auto;
    }

    .video-container {
      background: var(--bg-card);
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--accent-purple);
      box-shadow: 0 0 30px rgba(123,45,139,0.2);
    }

    .video-container video {
      width: 100%;
      display: block;
      max-height: 80vh;
      object-fit: contain;
      background: #000;
      border-radius: 14px;
    }

    .video-caption {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 1.5rem;
      text-align: center;
    }

    @media (max-width: 600px) {
      .page-title {
        font-size: 1.8rem;
      }
      .page-content {
        padding: 5rem 1rem 3rem;
      }
    }
  </style>
</head>
<body>

  <div id="particles-bg"></div>

  <a href="../gifts.html" style="position:fixed;top:0.8rem;left:0.8rem;font-family:'Lora',serif;color:var(--text-muted);text-decoration:none;z-index:100;font-size:0.9rem;transition:color 0.3s ease;min-height:44px;min-width:44px;display:inline-flex;align-items:center;padding:0.5rem 0.75rem;border-radius:8px;-webkit-tap-highlight-color:transparent" onmouseover="this.style.color='var(--text-light)'" onmouseout="this.style.color='var(--text-muted)'">← back to gifts</a>

  <div class="page-content">

    <div class="page-header">
      <h1 class="page-title">from your person.</h1>
      <p class="page-subtitle">because some things can only be said by the ones who knew you first.</p>
    </div>

    <div class="video-outer">

      <div class="video-container">
        <video controls playsinline preload="metadata">
          <source src="../assets/videos/bestfriend.mp4" type="video/mp4">
        </video>
      </div>

      <p class="video-caption">she had things to say. she said them.</p>

    </div>

  </div>

  <script src="../particles-config.js"></script>
  <script>
    if (typeof initParticles === 'function') {
      initParticles('particles-bg', 'light');
    } else if (typeof particlesJS !== 'undefined') {
      particlesJS('particles-bg', {
        particles: {
          number: { value: 50, density: { enable: true, value_area: 800 } },
          color: { value: '#7b2d8b' },
          shape: { type: 'circle' },
          opacity: { value: 0.15, random: true },
          size: { value: 2, random: true },
          line_linked: { enable: false },
          move: { enable: true, speed: 0.5, direction: 'none', random: true, straight: false, out_mode: 'out' }
        },
        interactivity: {
          detect_on: 'canvas',
          events: { onhover: { enable: false }, onclick: { enable: false }, resize: true }
        },
        retina_detect: true
      });
    }

    gsap.from('.page-header', {
      opacity: 0,
      y: -20,
      duration: 1,
      ease: 'power2.out',
      delay: 0.3
    });

    gsap.from('.video-outer', {
      opacity: 0,
      y: 30,
      duration: 1.2,
      ease: 'power2.out',
      delay: 0.7
    });

    gsap.from('.video-caption', {
      opacity: 0,
      duration: 0.8,
      ease: 'power2.out',
      delay: 1.3
    });
  </script>

</body>
</html>
