<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Her Wordle — Arushi Turns Twenty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <style>
    :root {
      --bg-dark: #0d0a0f;
      --bg-mid: #1a0f1e;
      --bg-card: #221528;
      --accent-red: #c0392b;
      --accent-purple: #7b2d8b;
      --accent-pink: #e8a0b4;
      --accent-gold: #d4a853;
      --text-light: #f5f0eb;
      --text-muted: #9e8a9e;
      --text-warm: #e8ddd0;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      font-family: 'Lora', serif;
      overflow-x: hidden;
    }

    .page-header {
      text-align: center;
      padding: 5rem 2rem 1.5rem;
    }

    .page-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 300;
      color: var(--text-light);
      letter-spacing: 0.05em;
    }

    .page-header p {
      font-family: 'Lora', serif;
      font-style: italic;
      color: var(--text-muted);
      margin-top: 0.5rem;
      font-size: 1rem;
    }

    #game-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
      gap: 1.5rem;
    }

    #grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .grid-row {
      display: flex;
      gap: 6px;
    }

    .tile {
      /* Fluid tile: fills available width on small screens */
      width: clamp(44px, 12vw, 58px);
      height: clamp(44px, 12vw, 58px);
      border: 2px solid var(--glass-border);
      background: var(--bg-card);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lora', serif;
      font-size: clamp(1.1rem, 4vw, 1.5rem);
      font-weight: 700;
      color: var(--text-light);
      text-transform: uppercase;
      transition: border-color 0.1s;
      position: relative;
      transform-style: preserve-3d;
    }

    .tile.filled {
      border-color: var(--text-muted);
      animation: tile-pop 0.1s ease;
    }

    @keyframes tile-pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    .tile.correct {
      background: var(--accent-red);
      border-color: var(--accent-red);
      color: white;
    }

    .tile.present {
      background: var(--accent-gold);
      border-color: var(--accent-gold);
      color: #000;
    }

    .tile.absent {
      background: #3a3a3a;
      border-color: #555;
      color: #666;
    }

    .tile.flip-in {
      animation: flip-in 0.25s ease forwards;
    }

    .tile.flip-out {
      animation: flip-out 0.25s ease forwards;
    }

    @keyframes flip-in {
      0% { transform: rotateX(0deg); }
      100% { transform: rotateX(-90deg); }
    }

    @keyframes flip-out {
      0% { transform: rotateX(-90deg); }
      100% { transform: rotateX(0deg); }
    }

    .grid-row.shake {
      animation: row-shake 0.5s ease;
    }

    @keyframes row-shake {
      0%, 100% { transform: translateX(0); }
      15%, 45%, 75% { transform: translateX(-6px); }
      30%, 60%, 90% { transform: translateX(6px); }
    }

    #keyboard {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      width: 100%;
      max-width: 500px;
      padding: 0 4px;
    }

    .keyboard-row {
      display: flex;
      gap: 4px;
      justify-content: center;
      width: 100%;
    }

    .key {
      /* Fluid width: fills row proportionally on any screen */
      flex: 1;
      height: 56px;
      min-width: 0;         /* let flex shrink below 38px if needed */
      max-width: 46px;
      padding: 0 2px;
      border-radius: 6px;
      border: none;
      background: #3a3040;
      color: var(--text-light);
      font-family: 'Lora', serif;
      font-size: clamp(0.65rem, 2.5vw, 0.85rem);
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation; /* no 300ms tap delay on mobile */
    }

    .key:active {
      transform: scale(0.92);
      background: #55405a;
    }

    /* Wide keys (ENTER / ⌫) get 1.6× the flex weight */
    .key.wide {
      flex: 1.6;
      max-width: 70px;
      font-size: clamp(0.6rem, 2.2vw, 0.75rem);
    }

    /* Mobile-specific: taller keys so thumbs can hit them */
    @media (max-width: 430px) {
      .key { height: 50px; }
      #keyboard { gap: 5px; }
      .keyboard-row { gap: 3px; }
    }

    .key.correct {
      background: var(--accent-red);
      color: white;
    }

    .key.present {
      background: var(--accent-gold);
      color: #000;
    }

    .key.absent {
      background: #2a2a2a;
      color: #555;
    }

    #message-bar {
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Lora', serif;
      font-style: italic;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    #reveal-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(13, 10, 15, 0.6);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s;
      padding-bottom: 2rem;
    }

    #reveal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    #reveal-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 2.5rem 3rem;
      text-align: center;
      max-width: 480px;
      width: 90%;
      transform: translateY(60px);
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    #reveal-overlay.active #reveal-card {
      transform: translateY(0);
    }

    #reveal-word {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem;
      font-weight: 600;
      color: var(--accent-pink);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    #reveal-note {
      font-family: 'Lora', serif;
      font-style: italic;
      color: var(--text-warm);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .reveal-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .reveal-btn {
      padding: 0.6rem 1.5rem;
      border-radius: 30px;
      border: 1px solid var(--accent-pink);
      background: transparent;
      color: var(--accent-pink);
      font-family: 'Lora', serif;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.3s, color 0.3s;
    }

    .reveal-btn:hover {
      background: var(--accent-pink);
      color: var(--bg-dark);
    }

    .reveal-btn.secondary {
      border-color: var(--text-muted);
      color: var(--text-muted);
    }

    .reveal-btn.secondary:hover {
      background: var(--text-muted);
      color: var(--bg-dark);
    }

    .confetti-piece {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      z-index: 300;
      pointer-events: none;
      animation: confetti-fall linear forwards;
    }

    @keyframes confetti-fall {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    #lose-notice {
      font-family: 'Lora', serif;
      font-style: italic;
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
    }

    @media (max-width: 400px) {
      .tile { width: 48px; height: 48px; font-size: 1.2rem; }
      .key { height: 48px; min-width: 30px; font-size: 0.75rem; }
      .key.wide { min-width: 50px; }
    }
  </style>
</head>
<body>
  <div id="particles-bg" style="position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.3"></div>

  <a href="../gifts.html" style="position:fixed;top:0.8rem;left:0.8rem;font-family:'Lora',serif;color:var(--text-muted);text-decoration:none;z-index:100;font-size:0.9rem;transition:color 0.3s;min-height:44px;min-width:44px;display:inline-flex;align-items:center;padding:0.5rem 0.75rem;border-radius:8px;-webkit-tap-highlight-color:transparent">← back to gifts</a>

  <div class="page-content" style="position:relative;z-index:1">
    <div class="page-header">
      <h1>her wordle</h1>
      <p>five letters. six tries.</p>
    </div>

    <div id="game-area">
      <div id="message-bar"></div>
      <div id="grid"></div>
      <div id="keyboard"></div>
    </div>
  </div>

  <div id="reveal-overlay">
    <div id="reveal-card">
      <div id="reveal-word"></div>
      <div id="reveal-note"></div>
      <div class="reveal-buttons">
        <button class="reveal-btn secondary" onclick="resetGame()">play again</button>
        <a class="reveal-btn" href="../gifts.html">back to gifts</a>
      </div>
    </div>
  </div>

  <script src="../particles-config.js"></script>
  <script>
    if (typeof initParticles === 'function') initParticles('particles-bg', 'light');

    const WORD_LIST = ['JAANU', 'DANCE', 'VIZAG', 'BINDI', 'SAREE', 'GADHI', 'STORE', 'KAMAR'];

    const WORD_NOTES = {
      'JAANU': '[PLACEHOLDER: Roy writes one line about this word for Arushi]',
      'DANCE': '[PLACEHOLDER: Something about dancing together or her dancing]',
      'VIZAG': '[PLACEHOLDER: Something about Vizag meaning]',
      'BINDI': '[PLACEHOLDER: Something sweet about this word]',
      'SAREE': '[PLACEHOLDER: A line about her in a saree]',
      'GADHI': '[PLACEHOLDER: An affectionate tease]',
      'STORE': '[PLACEHOLDER: An inside joke about a store]',
      'KAMAR': '[PLACEHOLDER: Something fun about this word]',
    };

    const ROWS = 6;
    const COLS = 5;
    const COLORS = ['#e8a0b4', '#d4a853', '#7b2d8b', '#c0392b', '#f5f0eb'];

    let targetWord = '';
    let currentRow = 0;
    let currentCol = 0;
    let currentGuess = [];
    let gameOver = false;
    let letterStates = {};

    function chooseWord() {
      const day = new Date().getDate();
      return WORD_LIST[day % WORD_LIST.length];
    }

    function buildGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        const row = document.createElement('div');
        row.className = 'grid-row';
        row.id = 'row-' + r;
        for (let c = 0; c < COLS; c++) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.id = `tile-${r}-${c}`;
          row.appendChild(tile);
        }
        grid.appendChild(row);
      }
    }

    function buildKeyboard() {
      const rows = [
        ['Q','W','E','R','T','Y','U','I','O','P'],
        ['A','S','D','F','G','H','J','K','L'],
        ['ENTER','Z','X','C','V','B','N','M','⌫']
      ];
      const keyboard = document.getElementById('keyboard');
      keyboard.innerHTML = '';
      rows.forEach(rowKeys => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'keyboard-row';
        rowKeys.forEach(k => {
          const btn = document.createElement('button');
          btn.className = 'key';
          if (k === 'ENTER' || k === '⌫') btn.classList.add('wide');
          btn.textContent = k;
          btn.setAttribute('data-key', k);
          btn.addEventListener('click', () => handleKey(k));
          rowDiv.appendChild(btn);
        });
        keyboard.appendChild(rowDiv);
      });
    }

    function setMessage(msg, duration = 0) {
      const bar = document.getElementById('message-bar');
      bar.textContent = msg;
      if (duration > 0) {
        setTimeout(() => { if (bar.textContent === msg) bar.textContent = ''; }, duration);
      }
    }

    function handleKey(key) {
      if (gameOver) return;
      if (key === '⌫' || key === 'BACKSPACE') {
        if (currentCol > 0) {
          currentCol--;
          currentGuess.pop();
          const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
          tile.textContent = '';
          tile.classList.remove('filled');
        }
        return;
      }
      if (key === 'ENTER') {
        submitGuess();
        return;
      }
      if (/^[A-Z]$/.test(key) && currentCol < COLS) {
        const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
        tile.textContent = key;
        tile.classList.add('filled');
        currentGuess.push(key);
        currentCol++;
      }
    }

    function submitGuess() {
      if (currentCol < COLS) {
        shakeRow(currentRow);
        setMessage('not enough letters', 1500);
        return;
      }
      const guess = currentGuess.join('');
      evaluateGuess(guess);
    }

    function evaluateGuess(guess) {
      const target = targetWord;
      const result = Array(COLS).fill('absent');
      const targetArr = target.split('');
      const guessArr = guess.split('');
      const targetCount = {};

      for (let i = 0; i < COLS; i++) {
        if (guessArr[i] === targetArr[i]) {
          result[i] = 'correct';
          targetArr[i] = null;
          guessArr[i] = null;
        }
      }

      for (let i = 0; i < COLS; i++) {
        if (guessArr[i] === null) continue;
        const idx = targetArr.indexOf(guessArr[i]);
        if (idx !== -1) {
          result[i] = 'present';
          targetArr[idx] = null;
        }
      }

      revealRow(currentRow, guess, result);
    }

    function revealRow(rowIndex, guess, result) {
      const delay = 300;
      for (let c = 0; c < COLS; c++) {
        const tile = document.getElementById(`tile-${rowIndex}-${c}`);
        setTimeout(() => {
          tile.classList.add('flip-in');
          setTimeout(() => {
            tile.classList.remove('flip-in');
            tile.classList.add(result[c]);
            tile.classList.add('flip-out');
            setTimeout(() => {
              tile.classList.remove('flip-out');
            }, 250);
          }, 250);
        }, c * delay);
      }

      setTimeout(() => {
        const guessLetters = guess.split('');
        guessLetters.forEach((letter, i) => {
          const state = result[i];
          const priority = { correct: 3, present: 2, absent: 1 };
          if (!letterStates[letter] || priority[state] > priority[letterStates[letter]]) {
            letterStates[letter] = state;
            updateKeyColor(letter, state);
          }
        });

        const won = result.every(r => r === 'correct');
        if (won) {
          setTimeout(() => showWin(guess), 300);
          return;
        }

        currentRow++;
        currentCol = 0;
        currentGuess = [];

        if (currentRow >= ROWS) {
          setTimeout(() => showLose(), 300);
        }
      }, COLS * delay + 300);
    }

    function updateKeyColor(letter, state) {
      const btn = document.querySelector(`[data-key="${letter}"]`);
      if (btn) {
        btn.classList.remove('correct', 'present', 'absent');
        btn.classList.add(state);
      }
    }

    function shakeRow(rowIndex) {
      const row = document.getElementById('row-' + rowIndex);
      row.classList.remove('shake');
      void row.offsetWidth;
      row.classList.add('shake');
      setTimeout(() => row.classList.remove('shake'), 500);
    }

    function showWin(guess) {
      gameOver = true;
      launchConfetti();
      setTimeout(() => {
        const overlay = document.getElementById('reveal-overlay');
        document.getElementById('reveal-word').textContent = targetWord;
        document.getElementById('reveal-note').textContent = WORD_NOTES[targetWord] || '';
        overlay.classList.add('active');
      }, 600);
    }

    function showLose() {
      gameOver = true;
      setMessage('the word was: ' + targetWord);
      setTimeout(() => {
        const overlay = document.getElementById('reveal-overlay');
        document.getElementById('reveal-word').textContent = targetWord;
        document.getElementById('reveal-note').textContent = "almost. — " + (WORD_NOTES[targetWord] || '');
        overlay.classList.add('active');
      }, 1000);
    }

    function launchConfetti() {
      for (let i = 0; i < 60; i++) {
        setTimeout(() => {
          const piece = document.createElement('div');
          piece.className = 'confetti-piece';
          piece.style.left = Math.random() * 100 + 'vw';
          piece.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
          piece.style.width = (Math.random() * 8 + 4) + 'px';
          piece.style.height = (Math.random() * 8 + 4) + 'px';
          piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
          piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 4000);
        }, i * 40);
      }
    }

    function resetGame() {
      currentRow = 0;
      currentCol = 0;
      currentGuess = [];
      gameOver = false;
      letterStates = {};
      targetWord = WORD_LIST[Math.floor(Math.random() * WORD_LIST.length)];
      buildGrid();
      buildKeyboard();
      setMessage('');
      document.getElementById('reveal-overlay').classList.remove('active');
    }

    document.addEventListener('keydown', (e) => {
      const key = e.key.toUpperCase();
      if (key === 'ENTER' || key === 'BACKSPACE' || /^[A-Z]$/.test(key)) {
        handleKey(key === 'BACKSPACE' ? '⌫' : key);
      }
    });

    function init() {
      targetWord = chooseWord();
      buildGrid();
      buildKeyboard();

      gsap.fromTo('.page-header h1', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 1, ease: 'power3.out' });
      gsap.fromTo('#grid', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, delay: 0.3, ease: 'power2.out' });
      gsap.fromTo('#keyboard', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, delay: 0.5, ease: 'power2.out' });
    }

    init();
  </script>
</body>
</html>
