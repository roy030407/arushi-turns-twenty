<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arushi Turns Twenty - Wrong Turn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0d0a0f;
      color: #f5f0eb;
      font-family: 'Lora', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }

    /* Floating hearts */
    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .heart {
      position: absolute;
      bottom: -20px;
      color: #e8a0b4;
      animation: float-up linear infinite;
      opacity: 0;
    }
    @keyframes float-up {
      0%   { transform: translateY(0) scale(1);   opacity: 0; }
      10%  { opacity: 0.25; }
      90%  { opacity: 0.15; }
      100% { transform: translateY(-110vh) scale(0.8); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 480px;
    }

    .four-o-four {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(5rem, 18vw, 8rem);
      font-weight: 300;
      color: #e8a0b4;
      line-height: 1;
      opacity: 0.35;
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
    }

    .message {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: clamp(1rem, 3vw, 1.3rem);
      color: #d2c8c0;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    .home-btn {
      display: inline-block;
      padding: 0.7rem 2rem;
      border-radius: 30px;
      border: 1px solid rgba(232, 160, 180, 0.4);
      color: #e8a0b4;
      text-decoration: none;
      font-family: 'Lora', serif;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }
    .home-btn:hover {
      background: rgba(232, 160, 180, 0.12);
      border-color: rgba(232, 160, 180, 0.7);
      color: #f5f0eb;
    }
  </style>
</head>
<body>

  <div class="hearts" aria-hidden="true">
    <span class="heart" style="left:8%;  font-size:11px; animation-duration:6.2s; animation-delay:0s;">♥</span>
    <span class="heart" style="left:22%; font-size:9px;  animation-duration:7.8s; animation-delay:1.4s;">♥</span>
    <span class="heart" style="left:38%; font-size:13px; animation-duration:5.6s; animation-delay:0.7s;">♥</span>
    <span class="heart" style="left:55%; font-size:10px; animation-duration:8.1s; animation-delay:2.1s;">♥</span>
    <span class="heart" style="left:70%; font-size:12px; animation-duration:6.9s; animation-delay:0.3s;">♥</span>
    <span class="heart" style="left:85%; font-size:8px;  animation-duration:7.3s; animation-delay:1.8s;">♥</span>
  </div>

  <div class="container">
    <div class="four-o-four">404</div>
    <p class="message">you took a wrong turn, love.<br>let's get you back.</p>
    <a class="home-btn" href="index.html">← take me home</a>
  </div>

</body>
</html>
